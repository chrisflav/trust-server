name = "trust-server"
version = "0.1.0"
testDriver = "tests"
defaultTargets = ["TrustServer", "trust-server"]

# The core library: `Trust.Cert` carries `Claim`, `Revocation`, `Entry` and
# `Bundle`, and the canonical bytes a signature is made over.  Restating those
# types here would be a second implementation of §3.2 to keep honest.
[[require]]
name = "trust"
git = "https://github.com/chrisflav/trust"
rev = "master"

# The storage engine.  `leansqlite` publishes a tag per Lean release, and
# `v4.32.0` is exactly the toolchain this package pins — so the store can be a
# database without moving `lean-toolchain`, and therefore without moving the
# `semantic_hash` revision that every certificate hash is computed with.  The
# SQLite amalgamation is compiled and linked into the binary, so a node needs a
# C compiler to *build* and nothing at all to *run*.
[[require]]
name = "leansqlite"
git = "https://github.com/leanprover/leansqlite"
rev = "v4.32.0"

# Pinned to the tag that matches this toolchain rather than `main`.
[[require]]
name = "Cli"
git = "https://github.com/leanprover/lean4-cli"
rev = "v4.32.0"

# `main` is on v4.31.0 and, since the Plausible integration, pulls in a
# `plausible` that does not compile on v4.32.0 (`Plausible/Testable.lean:383`,
# application type mismatch).  This is the last revision before that, and it
# builds here unchanged.
[[require]]
name = "LSpec"
git = "https://github.com/argumentcomputer/LSpec"
rev = "3e23a4ad2e91eaf07845cecad157b7ffbb437aed"

[[lean_lib]]
name = "TrustServer"
# Every module, not just the root: `TrustServer.Routes`, `TrustServer.Auth` and
# `TrustServer.Federation.*` are reached from the tests rather than from
# `TrustServer.lean`, and a module that only the tests build is one that
# `lake build` cannot tell you is broken.
globs = ["TrustServer", "TrustServer.+"]

[[lean_exe]]
name = "trust-server"
root = "Main"

[[lean_exe]]
name = "tests"
root = "Tests"
supportInterpreter = true
